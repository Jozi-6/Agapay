<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AGAPAY</title>
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // MIT License
    // https://github.com/rafgraph/spa-github-pages
    var pathSegmentToKeep = 2; // keep 2 segments (github username + repo name)
    
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentToKeep).join('/') + '/?path=' +
      (l.pathname.slice(1).split('/').slice(pathSegmentToKeep).join('/') || '') +
      (l.search ? '&' + l.search.slice(1) : '') +
      l.hash
    );
  </script>
</head>
<body>
</body>
</html>
